<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raza de Perros - Galería</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark menu">
            <div class="container">
                <a class="navbar-brand" href="index.html"><i class="fa-solid fa-paw"></i> Raza de Perros</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="razas.html">Razas</a></li>
                        <li class="nav-item"><a class="nav-link" href="cuidados.html">Cuidados</a></li>
                        <li class="nav-item"><a class="nav-link active" href="galeria.html">Galería</a></li>
                        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="encabezado">
            <h1>Galería</h1>
            <p>Dale clic a una foto para verla en grande.</p>
        </section>

        <section>
            <div class="row g-2">
                <article class="col-6 col-md-4 col-lg-3">
                    <img src="../img/labrador.webp" alt="Labrador Retriever" class="foto">
                </article>
                <article class="col-6 col-md-4 col-lg-3">
                    <img src="../img/golden.webp" alt="Golden Retriever" class="foto">
                </article>
                <article class="col-6 col-md-4 col-lg-3">
                    <img src="../img/pastor.jpg" alt="Pastor Alemán" class="foto">
                </article>
                <article class="col-6 col-md-4 col-lg-3">
                    <img src="../img/husky.webp" alt="Husky Siberiano" class="foto">
                </article>
                <article class="col-6 col-md-4 col-lg-3">
                    <img src="../img/border.webp" alt="Border Collie" class="foto">
                </article>
                <article class="col-6 col-md-4 col-lg-3">
                    <img src="../img/beagle.jpeg" alt="Beagle" class="foto">
                </article>
                <article class="col-6 col-md-4 col-lg-3">
                    <img src="../img/corgi.webp" alt="Corgi" class="foto">
                </article>
                <article class="col-6 col-md-4 col-lg-3">
                    <img src="../img/pug.jpg" alt="Pug" class="foto">
                </article>
                <article class="col-6 col-md-4 col-lg-3">
                    <img src="../img/chihuahua.jpeg" alt="Chihuahua" class="foto">
                </article>
                <article class="col-6 col-md-4 col-lg-3">
                    <img src="../img/galeria1.jpg" alt="Perro jugando" class="foto">
                </article>
                <article class="col-6 col-md-4 col-lg-3">
                    <img src="../img/galeria2.jpeg" alt="Cachorro durmiendo" class="foto">
                </article>
                <article class="col-6 col-md-4 col-lg-3">
                    <img src="../img/galeria3.jpeg" alt="Perros paseando" class="foto">
                </article>
            </div>
        </section>

        <!-- ventana para ver la foto grande -->
        <div class="modal fade" id="modalFoto" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 class="modal-title h5" id="nombreFoto"></h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body text-center">
                        <img id="fotoGrande" src="" alt="" class="img-fluid">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="d-flex justify-content-center align-items-center">
        <p class="mb-0"><i class="fa-solid fa-paw"></i> Proyecto Final - Unidad 2</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/funtion.js"></script>
</body>
</html>
